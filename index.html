<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c1117">
<title>45-Day Fitness</title>
<style>
:root {
  --bg:#0c1117; --surface:#121922; --surface2:#17212c; --surface3:#1d2935;
  --text:#f4f7fa; --muted:#9aa8b7; --line:#263442; --accent:#59d0a6;
  --accent2:#79a8ff; --mob:#b28cff; --warn:#f3b861; --danger:#ff6b6b;
  --ok:#59d0a6; --radius:18px; --shadow:0 16px 40px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:980px;margin:0 auto}
header.top{position:sticky;top:0;z-index:15;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:linear-gradient(180deg,rgba(12,17,23,.98),rgba(12,17,23,.9),rgba(12,17,23,0));backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:18px;margin:0;letter-spacing:.2px}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.02)}
main{padding:8px 16px 28px}
.view{display:none}
.view.active{display:block}
.card{background:linear-gradient(180deg,var(--surface),#10171f);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{padding:20px;background:radial-gradient(circle at 90% -10%,rgba(89,208,166,.18),transparent 42%),linear-gradient(180deg,#15202a,#111821)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--accent);font-weight:700}
.hero h2{font-size:28px;line-height:1.05;margin:8px 0 10px}
.meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:700;background:var(--surface3);color:var(--text);min-height:48px}
.btn.primary{background:var(--accent);color:#08110e}
.btn.secondary{background:var(--accent2);color:#07101d}
.btn.warn{background:var(--warn);color:#1c1203}
.btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(255,107,107,.45)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.full{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:13px}
.stat .num{font-size:22px;font-weight:800}
.stat .lab{font-size:12px;color:var(--muted);margin-top:3px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}
.section-title h3{margin:0;font-size:17px}
.small{font-size:12px;color:var(--muted)}
.progressbar{height:9px;background:#0b1016;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progressbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
.plan-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daycell{aspect-ratio:1/1;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative;font-weight:700;font-size:13px}
.daycell.today{outline:2px solid var(--accent);color:var(--text)}
.daycell.done{background:rgba(89,208,166,.12);border-color:rgba(89,208,166,.4);color:var(--accent)}
.daycell.rescue{background:rgba(243,184,97,.12);border-color:rgba(243,184,97,.45);color:var(--warn)}
.daycell.missed{border-color:rgba(255,107,107,.35);color:#ff9a9a}
.daycell.mobility::after{content:"";width:5px;height:5px;border-radius:99px;background:var(--mob);position:absolute;bottom:6px}
.daycell.checkpoint::before{content:"★";font-size:7px;position:absolute;top:4px;right:5px;color:var(--warn)}
.daycard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px}
.daybadge{width:44px;height:44px;flex:0 0 auto;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-weight:800}
.daycard .grow{min-width:0;flex:1}
.daycard h4{margin:0 0 4px;font-size:15px}
.daycard p{margin:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted);margin:3px 3px 0 0}
.tag.mob{color:#d7c5ff;border-color:rgba(178,140,255,.35)}
.tag.hard{color:#ffd6a3;border-color:rgba(243,184,97,.35)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,15,21,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.bottomnav .navinner{display:grid;grid-template-columns:repeat(5,1fr);width:min(720px,100%);gap:4px}
.navbtn{border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:12px;font-size:11px;min-height:52px}
.navbtn.active{background:var(--surface2);color:var(--text)}
.navicon{display:block;font-size:18px;margin-bottom:3px}
.list{display:flex;flex-direction:column;gap:8px}
.exercise-row{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.exercise-row h4{margin:0 0 4px}
.exercise-row p{margin:0;color:var(--muted);font-size:12px}
.search{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px 14px;outline:none}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.68);display:none;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.modal.show{display:flex}
.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.sheet h3{margin:0 0 10px}
.sheet .close{float:right;background:transparent;border:0;color:var(--muted);font-size:22px}
.formrow{margin:12px 0}
.formrow label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.formrow input,.formrow select,.formrow textarea{width:100%;background:#0f151c;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px}
.formrow textarea{min-height:72px;resize:vertical}
.readiness{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.player{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;overflow:auto;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.player.show{display:block}
.player-head{position:sticky;top:0;z-index:5;background:rgba(12,17,23,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.player-wrap{max-width:760px;margin:0 auto;padding:18px}
.big-ex{font-size:28px;line-height:1.05;margin:8px 0}
.setbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.setbox .stat{text-align:center}
.timer{font-variant-numeric:tabular-nums;font-size:50px;font-weight:800;letter-spacing:-2px;text-align:center;margin:16px 0}
.player-actions{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-top:12px}
.input-inline{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.input-inline input{width:100%;background:#0f151c;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px}
.blocklist{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.blockmini{font-size:12px;color:var(--muted);padding:5px 0}
.svgbox{background:#0f151c;border:1px solid var(--line);border-radius:16px;padding:10px;margin:10px 0;text-align:center}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px;font-size:13px;margin:7px 0}
.kv b{color:var(--muted);font-weight:600}
.chart{width:100%;height:160px;background:#0f151c;border:1px solid var(--line);border-radius:14px;display:block}
.achievement{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);display:flex;gap:10px;align-items:center}
.achievement.locked{opacity:.45}
.notice{padding:12px 13px;border-radius:14px;background:rgba(121,168,255,.08);border:1px solid rgba(121,168,255,.25);font-size:13px;color:#cfe0ff;margin-bottom:12px}
.warnbox{background:rgba(243,184,97,.08);border-color:rgba(243,184,97,.3);color:#ffe0b3}
.dangerbox{background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.3);color:#ffc0c0}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.hidden{display:none!important}
@media (max-width:560px){
  .grid3{grid-template-columns:1fr 1fr}
  .hero h2{font-size:25px}
  .player-actions{grid-template-columns:1fr 1.25fr 1fr}
  .plan-grid{gap:4px}
  .daycell{border-radius:10px}
}
@media (min-width:780px){
  main{padding-left:24px;padding-right:24px}
  .hero{padding:26px}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><h1>45-Day Fitness</h1><span class="pill" id="cyclePill">Cycle 1</span></div>
</header>
<main>
  <section id="view-today" class="view active"></section>
  <section id="view-plan" class="view"></section>
  <section id="view-progress" class="view"></section>
  <section id="view-exercises" class="view"></section>
  <section id="view-more" class="view"></section>
</main>
</div>

<nav class="bottomnav" aria-label="Primary">
  <div class="navinner">
    <button class="navbtn active" data-view="today"><span class="navicon">●</span>Today</button>
    <button class="navbtn" data-view="plan"><span class="navicon">▦</span>Plan</button>
    <button class="navbtn" data-view="progress"><span class="navicon">↗</span>Progress</button>
    <button class="navbtn" data-view="exercises"><span class="navicon">◎</span>Exercises</button>
    <button class="navbtn" data-view="more"><span class="navicon">•••</span>More</button>
  </div>
</nav>

<div class="modal" id="genericModal" role="dialog" aria-modal="true"><div class="sheet" id="modalBody"></div></div>
<div class="player" id="player"></div>
<input id="importInput" type="file" accept="application/json" class="hidden">

<script>
const APP = {"appVersion":"1.0.0","profile":{"age":40,"sex":"Male","height":"5'10\"","weight":"~180 lb","goals":["Look leaner","Improve flexibility","Establish a habit","Build muscle strength"],"primaryTransformation":"Core / abs","equipment":["15-lb dumbbell pair","25-lb dumbbell pair","35-lb dumbbell pair","Loop resistance bands","Long/handled resistance bands","Yoga mat","Peloton bike"]},"exercises":{"bodyweight_squat":{"id":"bodyweight_squat","name":"Bodyweight Squat","family":"squat","equipment":"Bodyweight","primary":"Quads, glutes","secondary":"Core, calves","setup":"Feet about shoulder-width, toes slightly out.","execution":"Sit hips down and back while knees track over toes; stand tall without locking out hard.","breathing":"Inhale down, exhale as you stand.","cue":"Keep your whole foot heavy on the floor.","mistakes":"Knees collapsing inward; heels lifting; rushing depth.","modification":"Reduce depth and slow the descent.","progression":"Add a 2-second pause at the bottom.","backAlt":"","neckNote":""},"cat_cow":{"id":"cat_cow","name":"Cat\u2013Cow","family":"mobility","equipment":"Mat","primary":"Spine mobility","secondary":"Breathing control","setup":"Start on hands and knees with wrists under shoulders and knees under hips.","execution":"Alternate gentle spinal flexion and extension through a comfortable range.","breathing":"Exhale into flexion, inhale into extension.","cue":"Move segment by segment, not aggressively.","mistakes":"Forcing end range; shrugging shoulders.","modification":"Make the range smaller.","progression":"Slow each phase to 4\u20135 seconds.","backAlt":"","neckNote":""},"glute_bridge":{"id":"glute_bridge","name":"Glute Bridge","family":"hinge","equipment":"Mat","primary":"Glutes","secondary":"Hamstrings, core","setup":"Lie on your back, knees bent, feet flat.","execution":"Brace lightly, drive through feet, lift hips until ribs and pelvis stay stacked, then lower with control.","breathing":"Exhale as hips rise, inhale down.","cue":"Finish with glutes, not your low back.","mistakes":"Overarching at the top; feet too far away.","modification":"Use a shorter range.","progression":"Add a dumbbell across the hips or a pause.","backAlt":"","neckNote":""},"shoulder_circles":{"id":"shoulder_circles","name":"Shoulder Circles","family":"mobility","equipment":"Bodyweight","primary":"Shoulders","secondary":"Upper back","setup":"Stand tall with ribs stacked.","execution":"Make slow controlled circles through a pain-free range.","breathing":"Breathe continuously.","cue":"Move the shoulder blades, not just the arms.","mistakes":"Fast, jerky circles.","modification":"Use smaller circles.","progression":"Increase range gradually.","backAlt":"","neckNote":""},"hip_hinge_reach":{"id":"hip_hinge_reach","name":"Hip-Hinge Reach","family":"hinge","equipment":"Bodyweight","primary":"Hamstrings, glutes","secondary":"Core","setup":"Stand tall, soften knees.","execution":"Push hips back while reaching arms forward, then squeeze glutes to stand.","breathing":"Inhale back, exhale up.","cue":"Close a car door with your hips.","mistakes":"Squatting instead of hinging; rounding back.","modification":"Reduce range.","progression":"Add a 2-second hamstring pause.","backAlt":"","neckNote":""},"bird_dog":{"id":"bird_dog","name":"Bird Dog","family":"anti-rotation","equipment":"Mat","primary":"Deep core","secondary":"Glutes, shoulders","setup":"Hands under shoulders, knees under hips.","execution":"Extend opposite arm and leg without rotating the pelvis; return slowly and alternate.","breathing":"Exhale during the reach.","cue":"Keep your belt buckle pointed at the floor.","mistakes":"Arching the low back; shifting side to side.","modification":"Move only the leg or only the arm.","progression":"Pause 2\u20133 seconds at full reach.","backAlt":"","neckNote":""},"hamstring_floss":{"id":"hamstring_floss","name":"Hamstring Floss","family":"mobility","equipment":"Mat","primary":"Hamstrings","secondary":"Calves","setup":"Lie on your back and hold one thigh behind the knee.","execution":"Keep thigh relatively still while slowly straightening and bending the knee.","breathing":"Exhale as the knee straightens.","cue":"Seek tension, not pain.","mistakes":"Forcing the knee straight; pulling hard on the neck.","modification":"Use a smaller range.","progression":"Slow the straightening phase.","backAlt":"","neckNote":""},"band_hamstring_stretch":{"id":"band_hamstring_stretch","name":"Band-Assisted Hamstring Stretch","family":"mobility","equipment":"Long resistance band + mat","primary":"Hamstrings","secondary":"Calves","setup":"Lie on your back; loop a long band around one foot.","execution":"Raise the leg until a mild stretch is felt, keeping pelvis heavy and knee softly extended.","breathing":"Slow nasal breathing.","cue":"Keep the opposite leg relaxed and pelvis level.","mistakes":"Yanking the band; lifting the pelvis.","modification":"Bend the knee slightly.","progression":"Gradually straighten the knee over successive breaths.","backAlt":"","neckNote":""},"90_90":{"id":"90_90","name":"90/90 Hip Switch","family":"mobility","equipment":"Mat","primary":"Hip rotation","secondary":"Glutes","setup":"Sit with both knees bent about 90 degrees.","execution":"Rotate knees side to side under control while keeping the torso tall.","breathing":"Breathe continuously.","cue":"Move from the hips, not by forcing the knees.","mistakes":"Collapsing through the low back; forcing range.","modification":"Use hands behind you for light support.","progression":"Reduce hand support and slow the transitions.","backAlt":"","neckNote":""},"hip_flexor_stretch":{"id":"hip_flexor_stretch","name":"Half-Kneeling Hip-Flexor Stretch","family":"mobility","equipment":"Mat","primary":"Hip flexors","secondary":"Quads, glutes","setup":"Half-kneel with one knee padded on the mat.","execution":"Tuck pelvis slightly, squeeze the rear glute, shift forward a few inches.","breathing":"Long exhale into the stretch.","cue":"Think belt buckle up toward ribs.","mistakes":"Arching the low back.","modification":"Use a shorter stance and smaller shift.","progression":"Add same-side arm reach.","backAlt":"","neckNote":""},"open_book":{"id":"open_book","name":"Open-Book Rotation","family":"mobility","equipment":"Mat","primary":"Thoracic spine","secondary":"Chest, shoulders","setup":"Lie on one side with hips and knees bent, arms straight in front.","execution":"Rotate the top arm and upper back open while knees stay stacked.","breathing":"Exhale as you open.","cue":"Rotate from the rib cage, not the low back.","mistakes":"Letting knees separate; forcing the shoulder to the floor.","modification":"Use a smaller rotation.","progression":"Pause at end range for 2 breaths.","backAlt":"","neckNote":""},"thoracic_rotation":{"id":"thoracic_rotation","name":"Quadruped Thoracic Rotation","family":"mobility","equipment":"Mat","primary":"Thoracic spine","secondary":"Shoulders","setup":"Hands and knees; place one hand lightly behind the head.","execution":"Rotate elbow toward opposite wrist, then open toward the ceiling.","breathing":"Exhale as you open.","cue":"Keep hips quiet.","mistakes":"Twisting through the low back.","modification":"Make range smaller.","progression":"Pause briefly at the top.","backAlt":"","neckNote":""},"band_shoulder_open":{"id":"band_shoulder_open","name":"Band Shoulder Open","family":"mobility","equipment":"Long resistance band","primary":"Shoulders, chest","secondary":"Upper back","setup":"Hold a long band wider than shoulder-width with soft elbows.","execution":"Raise the band overhead and slightly behind only as far as comfortable; return.","breathing":"Breathe slowly.","cue":"Keep ribs down as arms move.","mistakes":"Flared ribs; forcing shoulder range.","modification":"Widen grip.","progression":"Narrow grip gradually.","backAlt":"","neckNote":""},"neck_cars":{"id":"neck_cars","name":"Gentle Neck CARs","family":"mobility","equipment":"Bodyweight","primary":"Neck mobility","secondary":"Upper traps","setup":"Sit or stand tall with shoulders relaxed.","execution":"Slowly trace a comfortable half-circle or controlled rotation without forcing end range.","breathing":"Breathe continuously.","cue":"Make it small and smooth.","mistakes":"Fast circles; cranking into stiffness.","modification":"Use only rotations and nods.","progression":"Increase range gradually if symptom-free.","backAlt":"","neckNote":""},"down_dog_pedal":{"id":"down_dog_pedal","name":"Down-Dog Pedal","family":"mobility","equipment":"Mat","primary":"Hamstrings, calves","secondary":"Shoulders","setup":"From hands and feet, lift hips into an inverted V with knees soft.","execution":"Alternately bend one knee while lengthening the opposite heel toward the floor.","breathing":"Breathe steadily.","cue":"Long spine first, straight legs second.","mistakes":"Rounding hard through the low back; locking knees.","modification":"Keep both knees bent.","progression":"Pause longer on each side.","backAlt":"","neckNote":""},"goblet_squat":{"id":"goblet_squat","name":"Goblet Squat","family":"squat","equipment":"1 dumbbell","primary":"Quads, glutes","secondary":"Core","setup":"Hold one dumbbell vertically at chest height; feet shoulder-width.","execution":"Sit between the hips, keep chest stacked, drive through the whole foot to stand.","breathing":"Inhale down, exhale through the sticking point.","cue":"Elbows stay close; knees track with toes.","mistakes":"Collapsing knees; heels lifting; losing rib position.","modification":"Use 25 lb or reduce depth.","progression":"Use 35 lb, slower eccentric, or a bottom pause.","backAlt":"","neckNote":""},"pause_goblet_squat":{"id":"pause_goblet_squat","name":"Paused Goblet Squat","family":"squat","equipment":"1 dumbbell","primary":"Quads, glutes","secondary":"Core","setup":"Set up as a goblet squat.","execution":"Lower under control, pause 2 seconds near the bottom, then stand without bouncing.","breathing":"Inhale down; hold brace during pause; exhale up.","cue":"Own ogether.","execution":"Step wide to one side, sit hips back over that leg, keep opposite leg long, return to center.","breathing":"Inhale into the lunge, exhale back.","cue":"Hips back; whole foot down.","mistakes":"Knee diving inward; torso collapsing.","modification":"Bodyweight and shorter step.","progression":"Hold 15\u201325 lb goblet-style.","backAlt":"","neckNote":""},"rdl":{"id":"rdl","name":"Dumbbell Romanian Deadlift","family":"hinge","equipment":"Pair of dumbbells","primary":"Hamstrings, glutes","secondary":"Core, upper back","setup":"Stand tall with dumbbells at thighs, knees softly bent.","execution":"Push hips back while dumbbells track close to legs; stop when hamstrings limit range, then stand tall.","breathing":"Inhale down, exhale as hips extend.","cue":"Hips travel back; spine stays long.","mistakes":"Reaching toward the floor; rounding low back.","modification":"Use 15\u201325 lb pair and shorter range.","progression":"35-lb pair, slower eccentric, or pauses.","backAlt":"","neckNote":""},"staggered_rdl":{"id":"staggered_rdl","name":"Staggered-Stance RDL","family":"hinge","equipment":"Pair of dumbbells","primary":"Hamstrings, glutes","secondary":"Core","setup":"Place one foot slightly behind as a kickstand.","execution":"Load most weight into the front leg and hinge back while keeping hips square.","breathing":"Inhale down, exhale up.","cue":"Front hip travels backward.","mistakes":"Rotating pelvis; pushing off rear foot.","modification":"Use one dumbbell or lighter pair.","progression":"Use 35-lb pair or 3-second eccentric.","backAlt":"","neckNote":""},"sumo_rdl":{"id":"sumo_rdl","name":"Sumo Dumbbell RDL","family":"hinge","equipment":"1\u20132 dumbbells","primary":"Glutes, hamstrings, adductors","secondary":"Core","setup":"Take a wider stance with toes slightly out.","execution":"Hinge hips back while knees remain softly bent; stand by driving hips forward.","breathing":"Inhale down, exhale up.","cue":"Wide stance, hips back.","mistakes":"Turning it into a deep squat.","modification":"Use one 25-lb dumbbell.","progression":"Pair of 35s or slower tempo.","backAlt":"","neckNote":""},"floor_press":{"id":"floor_press","name":"Dumbbell Floor Press","family":"horizontal push","equipment":"Pair of dumbbells + mat","primary":"Chest, triceps","secondary":"Front shoulders","setup":"Lie on your back, knees bent, dumbbells over chest.","execution":"Lower elbows until upper arms gently contact floor, pause, press back up.","breathing":"Inhale down, exhale up.","cue":"Upper arms touch softly; wrists stacked.","mistakes":"Bouncing elbows; flared ribs.","modification":"Use 15\u201325 lb pair.","progression":"35-lb pair, pause reps, or slower lowering.","backAlt":"","neckNote":""},"alternating_floor_press":{"id":"alternating_floor_press","name":"Alternating Floor Press","family":"horizontal push","equipment":"Pair of dumbbells + mat","primary":"Chest, triceps","secondary":"Core","setup":"Start with both dumbbells pressed up.","execution":"Lower and press one arm while the other remains locked out; alternate sides.","breathing":"Exhale each press.","cue":"Keep ribs heavy and pelvis quiet.","mistakes":"Rotating torso; rushing.","modification":"Use 15\u201325 lb pair.","progression":"Use 35s or 3-second lowering.","backAlt":"","neckNote":""},"close_grip_floor_press":{"id":"close_grip_floor_press","name":"Close-Grip Floor Press","family":"horizontal push","equipment":"Pair of dumbbells + mat","primary":"Triceps, chest","secondary":"Front shoulders","setup":"Lie on mat with dumbbells held close and neutral grip.","execution":"Lower elbows near ribs until upper arms touch floor, then press.","breathing":"Inhale down, exhale up.","cue":"Elbows skim the ribs.","mistakes":"Wrists bending back; shoulders shrugging.","modification":"Use 15-lb pair.","progression":"Increase load or add pause.","backAlt":"","neckNote":""},"pushup":{"id":"pushup","name":"Push-Up","family":"horizontal push","equipment":"Mat","primary":"Chest, triceps","secondary":"Core, shoulders","setup":"Hands slightly wider than shoulders; body in a straight line.","execution":"Lower chest toward floor with elbows angled back; press away without sagging.","breathing":"Inhale down, exhale up.","cue":"Move as one solid plank.","mistakes":"Hips sagging; head reaching forward.","modification":"Use hands elevated only if a safe surface is available; otherwise shorten range from knees.","progression":"Slow eccentric, pause, or add reps.","backAlt":"","neckNote":""},"tempo_pushup":{"id":"tempo_pushup","name":"Tempo Push-Up","family":"horizontal push","equipment":"Mat","primary":"Chest, triceps","secondary":"Core, shoulders","setup":"Set up in a strong push-up position.","execution":"Lower for 3 seconds, pause 1 second, press up smoothly.","breathing":"Inhale down, exhale up.","cue":"Stay rigid through the slow descent.","mistakes":"Losing plank position.","modification":"Perform from knees.","progression":"Add reps or a longer pause.","backAlt":"","neckNote":""},"oh_press":{"id":"oh_press","name":"Standing Dumbbell Overhead Press","family":"vertical push","equipment":"Pair of dumbbells","primary":"Shoulders, triceps","secondary":"Core","setup":"Stand tall, dumbbells at shoulders, glutes lightly engaged.","execution":"Press overhead without leaning back; lower with control.","breathing":"Exhale up, inhale down.","cue":"Ribs stay stacked over pelvis.","mistakes":"Overarching; shrugging aggressively.","modification":"Use 15-lb pair or one arm at a time.","progression":"25-lb pair, slower lowering, or half-kneeling only if comfortable.","backAlt":"","neckNote":"Keep head neutral; stop if neck symptoms increase."},"arnold_press":{"id":"arnold_press","name":"Arnold Press","family":"vertical push","equipment":"Pair of dumbbells","primary":"Shoulders","secondary":"Triceps","setup":"Start dumbbells in front of shoulders, palms facing you.","execution":"Rotate palms out as you press overhead; reverse under control.","breathing":"Exhale up, inhale down.","cue":"Smooth rotation, quiet ribs.","mistakes":"Forcing shoulder rotation; leaning back.","modification":"Use 15-lb pair.","progression":"Use 25s if form remains clean.","backAlt":"","neckNote":"Keep range pain-free and shoulders relaxed."},"one_arm_row":{"id":"one_arm_row","name":"Split-Stance One-Arm Dumbbell Row","family":"horizontal pull","equipment":"1 dumbbell","primary":"Lats, mid-back","secondary":"Biceps, core","setup":"Take a split stance and hinge slightly; free hand can rest lightly on front thigh.","execution":"Row dumbbell toward hip without rotating torso, then lower fully.","breathing":"Exhale on row, inhale down.","cue":"Drive elbow toward back pocket.","mistakes":"Shrugging; twisting; yanking.","modification":"Use 25 lb.","progression":"Use 35 lb with pause or slower lowering.","backAlt":"","neckNote":""},"bent_over_row":{"id":"bent_over_row","name":"Bent-Over Dumbbell Row","family":"horizontal pull","equipment":"Pair of dumbbells","primary":"Lats, mid-back","secondary":"Biceps, posterior chain","setup":"Hinge to a comfortable torso angle, dumbbells hanging under shoulders.","execution":"Row both dumbbells toward ribs, squeeze shoulder blades, lower with control.","breathing":"Exhale up, inhale down.","cue":"Keep neck long and hips back.","mistakes":"Standing up each rep; shrugging.","modification":"Use 15\u201325 lb pair.","progression":"Use 35s or pause at the top.","backAlt":"If low back tires, switch to one-arm split-stance rows.","neckNote":""},"band_row":{"id":"band_row","name":"Standing Band Row","family":"horizontal pull","equipment":"Long resistance band","primary":"Mid-back, lats","secondary":"Biceps","setup":"Anchor band securely at about rib height using the band's intended anchor method.","execution":"Stand tall with arms extended and tension in the band.","breathing":"Pull handles toward ribs, squeeze shoulder blades, return slowly.","cue":"Exhale on pull, inhale return.","mistakes":"Shoulders down and back.","modification": ders","secondary":"Hip flexors","setup":"Hold one or two dumbbells at shoulder height.","execution":"March in place while keeping ribs down and torso quiet.","breathing":"Exhale each knee lift.","cue":"Quiet torso, slow feet.","mistakes":"Leaning back; shrugging.","modification":"Use one 15-lb dumbbell.","progression":"Use 25s or longer time.","backAlt":"","neckNote":"Keep shoulders relaxed and neck neutral."},"dead_bug":{"id":"dead_bug","name":"Dead Bug","family":"anti-extension","equipment":"Mat","primary":"Deep abdominals","secondary":"Hip flexors","setup":"Lie on back, hips and knees at 90\u00b0, arms up.","execution":"Gently flatten ribs, extend opposite arm and leg without losing low-back control, then switch.","breathing":"Exhale during extension.","cue":"Keep your low back quietly connected to the mat.","mistakes":"Arching as limbs extend; moving too fast.","modification":"Move only legs or only arms.","progression":"Hold light dumbbells or lengthen the lever.","backAlt":"Preferred substitute when leg raises bother the low back.","neckNote":""},"cross_dead_bug":{"id":"cross_dead_bug","name":"Cross-Body Dead Bug","family":"anti-extension","equipment":"Mat","primary":"Deep abdominals","secondary":"Obliques","setup":"Set up as a dead bug.","execution":"Extend opposite arm and leg slowly, adding a small cross-body reach at the return.","breathing":"Long exhale on extension.","cue":"Ribs down, pelvis quiet.","mistakes":"Arching or twisting.","modification":"Use standard dead bug.","progression":"Add a pause near full extension.","backAlt":"","neckNote":""},"plank":{"id":"plank","name":"Forearm Plank","family":"anti-extension","equipment":"Mat","primary":"Abdominals","secondary":"Shoulders, glutes","setup":"Forearms under shoulders, legs long.","execution":"Brace glutes and abs, keep a straight line from head to heels.","breathing":"Slow, controlled breaths.","cue":"Pull ribs toward pelvis without rounding.","mistakes":"Sagging hips; craning neck.","modification": function generateCycle(number,review,prev){
  const plan=clone(APP.basePlan);
  const focus=review?.focus||"Balanced";
  const coreFamilies=new Set(["direct abs","anti-extension","anti-rotation","lateral core","loaded core","rotation"]);
  const mobilityAlternates={
    hamstring_floss:["hamstring_floss","band_hamstring_stretch","down_dog_pedal"],
    band_hamstring_stretch:["band_hamstring_stretch","hamstring_floss","down_dog_pedal"],
    "90_90":["90_90","hip_flexor_stretch"],
    hip_flexor_stretch:["hip_flexor_stretch","90_90"],
    open_book:["open_book","thoracic_rotation"],
    thoracic_rotation:["thoracic_rotation","open_book"],
    band_shoulder_open:["band_shoulder_open","shoulder_circles"],
    shoulder_circles:["shoulder_circles","band_shoulder_open"],
    neck_cars:["neck_cars"]
  };
  const perf={};
  Object.values(prev.completions||{}).forEach(c=>(c.logs||[]).forEach(l=>{
    if(!l.skipped) perf[l.exercise]={load:String(l.load||""),rpe:Number(c.rpe||0)};
  }));

  plan.forEach(d=>{
    d.blocks.forEach((b,bi)=>b.items.forEach((it,ii)=>{
      if(it.rideSegments){
        if(number>1 && ["Cardio","Balanced"].includes(focus)){
          it.rideSegments=it.rideSegments.map((seg,idx)=>idx===2
            ? {...seg,rpe:(seg.rpe==="6"?"6–7":seg.rpe),cue:seg.cue+" Slightly stronger than the prior cycle."}
            : seg);
        }
        return;
      }

      const blockName=(b.name||"").toLowerCase();

      // Keep warm-ups, checkpoint tests, and downshifts stable and repeatable.
      if(blockName.includes("warm-up") || blockName.includes("checkpoint") || blockName.includes("downshift")) return;

      // Vary mobility only within the same mobility purpose instead of randomizing the whole category.
      if(it.family==="mobility"){
        const mp=mobilityAlternates[it.exercise]||[it.exercise];
        const seed=hashSeed(`${number}-${d.day}-${bi}-${ii}-${focus}-mob`);
        it.exercise=mp[seed%mp.length];
        return;
      }

      const pool=APP.pools[it.family];
      if(!pool||pool.length<2) return;

      const old=it.exercise;
      const seed=hashSeed(`${number}-${d.day}-${bi}-${ii}-${focus}`);
      let choices=pool.slice();

      // If back stiffness worsened, bias core choices toward stable, lower-back-friendly patterns.
      if(review?.back==="Worse" && coreFamilies.has(it.family)){
        const safer=["dead_bug","cross_dead_bug","pallof_press","side_plank","reverse_crunch","suitcase_march"];
        const filtered=choices.filter(x=>safer.includes(x));
        if(filtered.length) choices=filtered;
      }

      // Keep overhead work simpler if neck stiffness worsened.
      if(review?.neck==="Worse" && it.family==="vertical push"){
        choices=["oh_press"];
        it.load="15 lb pair; progress only if neck stays relaxed";
      }

      let choice=pickDet(choices,seed);
      if(choice===old && choices.length>1) choice=choices[(choices.indexOf(choice)+1)%choices.length];

      if(focus==="Abs" && coreFamilies.has(it.family)){
        choice=choices[(seed+1)%choices.length];
      }

      it.exercise=choice;

      // Use prior-cycle performance to progress without pretending heavier dumbbells exist.
      const prior=perf[old];
      if(prior && prior.load.includes("35") && prior.rpe && prior.rpe<=7){
        it.tempo="3-1-1";
        it.note=(it.note?it.note+" ":"")+"Progressed via tempo because prior 35-lb work was controlled.";
      }

      if(review?.challenge==="Too easy" && d.isWorkout){
        it.tempo="3-1-1";
        it.note=(it.note?it.note+" ":"")+"Use the upper end of the rep/load range with clean form.";
      }
      if(review?.challenge==="Too hard" && d.isWorkout && it.sets>1){
        it.sets=Math.max(1,it.sets-1);
        it.note=(it.note?it.note+" ":"")+"Volume reduced from the prior cycle review.";
      }

      if(number>1 && d.isWorkout && ["Strength","Abs","Balanced"].includes(focus)){
        if(typeof it.reps==="string" && /^\d/.test(it.reps) && !it.reps.includes("/side") && review?.challenge!=="Too hard"){
          it.tempo = it.tempo || (number%2===0 ? "3-1-1" : "2-1-1");
        }
      }
    }));
  });

  return {number,startDate:isoDate(),plan,completions:{},checkpoints:{},review:null,endedDate:null,generatedFrom:prev.number};
}
function shiftMissed(day){
  const pd=programDay(), c=cycle(), src=c.plan[day-1], target=c.plan[pd-1];
  if(!src?.isWorkout) return;

  const moved=clone(src); moved.day=pd;

  if(target.isWorkout && !isDone(pd)){
    // Put the missed workout today and move today's scheduled workout
    // into the next available recovery slot, preserving both sessions.
    const nextFreeIndex=c.plan.findIndex((d,idx)=>idx>=pd && !d.isWorkout && !isDone(d.day));
    if(nextFreeIndex>=0){
      const deferred=clone(target); deferred.day=nextFreeIndex+1;
      c.plan[nextFreeIndex]=deferred;
    }
    c.plan[pd-1]=moved;
    c.plan[day-1]=mobilityFallback(day);
  } else {
    c.plan[pd-1]=moved;
    c.plan[day-1]=mobilityFallback(day);
  }
  saveState();render("today");
}
function mobilityFallback(day){
  return {day,type:"mobility",phase:cycle().plan[day-1].phase,title:"Recovery Mobility",duration:8,intensity:"Easy",equipment:"Mat + band",focus:"Mobility reset",stepTarget:cycle().plan[day-1].stepTarget,isWorkout:false,checkpoint:false,blocks:clone(APP.basePlan.find(x=>x.type==="mobility")?.blocks||[])};
}

function showExercise(id){
  const ex=APP.exercises[id]; if(!ex)return;
  showModal(`<button class="close" onclick="closeModal()">×</button><div class="eyebrow">${esc(ex.family)}</div><h3>${esc(ex.name)}</h3>
    <div class="svgbox">${exerciseDiagram(ex)}</div>
    <div class="kv"><b>Equipment</b><span>${esc(ex.equipment)}</span></div>
    <div class="kv"><b>Primary</b><span>${esc(ex.primary)}</span></div>
    <div class="kv"><b>Secondary</b><span>${esc(ex.secondary)}</span></div>
    <hr><div class="kv"><b>Setup</b><span>${esc(ex.setup)}</span></div>
    <div class="kv"><b>Execution</b><span>${esc(ex.execution)}</span></div>
    <div class="kv"><b>Breathing</b><span>${esc(ex.breathing)}</span></div>
    <div class="kv"><b>Key cue</b><span>${esc(ex.cue)}</span></div>
    <div class="kv"><b>Avoid</b><span>${esc(ex.mistakes)}</span></div>
    <div class="kv"><b>Modify</b><span>${esc(ex.modification)}</span></div>
    <div class="kv"><b>Progress</b><span>${esc(ex.progression)}</span></div>
    ${ex.backAlt?`<div class="notice warnbox"><b>Back-friendly note:</b> ${esc(ex.backAlt)}</div>`:""}
    ${ex.neckNote?`<div class="notice"><b>Neck/shoulder note:</b> ${esc(ex.neckNote)}</div>`:""}
  `);
}

function renderExercises(){
  const families=[...new Set(Object.values(APP.exercises).map(e=>e.family))].sort();
  document.getElementById("view-exercises").innerHTML=`<div class="section-title"><h3>Exercise Library</h3><span class="small">${Object.keys(APP.exercises).length} movements</span></div>
  <input id="exSearch" class="search" placeholder="Search exercises, muscles, or families…" oninput="filterExercises()">
  <div id="exList" class="list" style="margin-top:10px"></div>`;
  filterExercises();
}
function filterExercises(){
  const q=(document.getElementById("exSearch")?.value||"").toLowerCase();
  const arr=Object.values(APP.exercises).filter(e=>[e.name,e.family,e.primary,e.secondary].join(" ").toLowerCase().includes(q));
  document.getElementById("exList").innerHTML=arr.map(e=>`<button class="exercise-row" style="text-align:left;color:inherit" onclick="showExercise('${e.id}')"><h4>${esc(e.name)}</h4><p>${esc(e.family)} · ${esc(e.primary)}</p></button>`).join("");
}

function svgLineChart(points,labels){
  const w=620,h=150,p=22;if(!points.length)return `<div class="small">No data yet.</div>`;
  const max=Math.max(...points,1),min=Math.min(...points,0),span=Math.max(1,max-min);
  const pts=points.map((v,i)=>{const x=p+(w-2*p)*(i/Math.max(1,points.length-1));const y=h-p-(h-2*p)*((v-min)/span);return [x,y]});
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#263442"/>
    <polyline fill="none" stroke="#59d0a6" stroke-width="4" points="${pts.map(p=>p.join(",")).join(" ")}"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#79a8ff"><title>${labels[i]}: ${points[i]}</title></circle>`).join("")}
  </svg>`;
}
function lifetimeWorkouts(){
  return state.cycles.reduce((n,c)=>{
    const primary=new Set(c.plan.filter(d=>d.isWorkout).map(d=>String(d.day)));
    return n+[...primary].filter(k=>["full","rescue"].includes(c.completions[k]?.status)).length;
  },0);
}
function bestAdherence(){ return Math.max(...state.cycles.map(c=>completionPct(c)),0); }
function evaluateAchievements(){
  const a=state.achievements||{};
  const completedCycles=state.cycles.filter(c=>c.endedDate).length;
  if(completedCycles>=1)a.first45=true;
  if(lifetimeWorkouts()>=100)a.century=true;
  if(completedCycles>=3)a.triple=true;
  if(state.cycles.some(c=>c.endedDate&&completionPct(c)>=90))a.consistency90=true;
  const c=cycle(),cp1=c.checkpoints["1"],cp45=c.checkpoints["45"];
  if(cp1&&cp45&&cp45.toe>cp1.toe)a.mobility=true;
  if(cp1&&cp45&&cp45.plank>cp1.plank)a.core=true;
  state.achievements=a;saveState();
}
function renderProgress(){
  evaluateAchievements();
  const c=cycle(), cps=Object.values(c.checkpoints).sort((a,b)=>a.day-b.day);
  const push=cps.map(x=>x.pushups), plank=cps.map(x=>x.plank), labs=cps.map(x=>"Day "+x.day);
  const achievements=[
    ["first45","First 45","Complete one full 45-day cycle"],
    ["century","Century Club","Complete 100 lifetime workouts"],
    ["triple","Triple Cycle","Complete 3 full cycles"],
    ["consistency90","Consistency 90","Finish a cycle at 90%+ adherence"],
    ["mobility","Mobility Level-Up","Improve checkpoint toe-touch score"],
    ["core","Core Builder","Improve checkpoint core endurance"]
  ];
  const hist=state.cycles.slice().reverse().map(x=>`<div class="daycard"><div class="daybadge">${x.number}</div><div class="grow"><h4>Cycle ${x.number}</h4><p>${x.startDate}${x.endedDate?" → "+x.endedDate:" • current"} · ${completionPct(x)}% adherence</p></div></div>`).join("");
  document.getElementById("view-progress").innerHTML=`
  <div class="grid3">
    <div class="stat"><div class="num">${state.cycles.filter(x=>x.endedDate).length}</div><div class="lab">cycles completed</div></div>
    <div class="stat"><div class="num">${lifetimeWorkouts()}</div><div class="lab">lifetime workouts</div></div>
    <div class="stat"><div class="num">${bestAdherence()}%</div><div class="lab">best adherence</div></div>
  </div>
  <div class="section-title"><h3>Current cycle</h3><span class="small">${completionPct(c)}% adherence</span></div>
  <div class="card"><div class="grid3">
    <div class="stat"><div class="num">${workoutCompletionCount(c)}</div><div class="lab">full</div></div>
    <div class="stat"><div class="num">${rescueCount(c)}</div><div class="lab">rescue</div></div>
    <div class="stat"><div class="num">${Object.keys(c.checkpoints).length}</div><div class="lab">checkpoints</div></div>
  </div></div>
  <div class="section-title"><h3>Push-up benchmark</h3></div><div class="card">${svgLineChart(push,labs)}</div>
  <div class="section-title"><h3>Core endurance</h3></div><div class="card">${svgLineChart(plank,labs)}</div>
  <div class="section-title"><h3>Achievements</h3></div><div class="list">${achievements.map(([id,n,d])=>`<div class="achievement ${state.achievements[id]?"":"locked"}"><div style="font-size:22px">${state.achievements[id]?"★":"☆"}</div><div><b>${n}</b><div class="small">${d}</div></div></div>`).join("")}</div>
  <div class="section-title"><h3>Cycle history</h3></div>${hist}`;
}

function renderMore(){
  document.getElementById("view-more").innerHTML=`
  <div class="section-title"><h3>App & Data</h3></div>
  <div class="card"><div class="list">
    <button class="btn ghost" onclick="exportData()">Export progress (JSON)</button>
    <button class="btn ghost" onclick="document.getElementById('importInput').click()">Import progress</button>
    <button class="btn danger" onclick="confirmReset()">Reset program</button>
  </div></div>
  <div class="section-title"><h3>Program rules</h3></div>
  <div class="card"><div class="small" style="font-size:13px;line-height:1.5">
    <b>Training:</b> 45 calendar days, ~4 primary workouts/week, full sessions ≤30 minutes, direct core work every full workout, mostly steady Peloton endurance, low-impact home training.<br><br>
    <b>Recovery:</b> 5–10 minute mobility on recovery nights is encouraged. Six hours of inconsistent sleep means not every workout is intended to be maximal.<br><br>
    <b>Pain rule:</b> Muscular effort and mild stretch are expected. Stop the relevant movement for sharp pain, increasing back pain, numbness, tingling, or weakness.
  </div></div>
  <div class="section-title"><h3>Equipment</h3></div>
  <div class="card"><div class="small">${APP.profile.equipment.map(esc).join(" • ")}</div></div>
  <div class="small" style="text-align:center;margin-top:16px">45-Day Fitness App v${APP.appVersion} · local-only storage</div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),state},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="45-day-fitness-progress-"+isoDate()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.getElementById("importInput").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const obj=JSON.parse(r.result);const s=obj.state||obj;if(!s.cycles)throw new Error("Invalid backup");state=s;saveState();alert("Progress imported.");setView("today");}catch(err){alert("Could not import this file.");}};
  r.readAsText(f);e.target.value="";
});
function confirmReset(){
  showModal(`<button class="close" onclick="closeModal()">×</button><h3>Reset the entire app?</h3><div class="notice dangerbox">This deletes local workout history from this browser. Export first if you want a backup.</div>
  <button class="btn full danger" onclick="resetAll()">Reset everything</button><button class="btn full ghost" style="margin-top:8px" onclick="closeModal()">Cancel</button>`);
}
function resetAll(){ state=freshState();saveState();closeModal();setView("today"); }

// Initial safety check & render
(function boot(){
  try{
    if(state.inProgress) document.getElementById("player").classList.remove("show");
    render(state.prefs.lastView||"today");
  }catch(err){
    console.error(err);
    document.getElementById("view-today").innerHTML='<div class="notice dangerbox">The app hit a local data error. Use More → Reset Program, or import a valid backup.</div>';
  }
})();
</script>
</body>
